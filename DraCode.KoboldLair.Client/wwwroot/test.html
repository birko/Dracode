<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoboldLair Test</title>
    <style>
        body {
            margin: 20px;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>KoboldLair Client Diagnostics</h1>
    <div id="results"></div>

    <script type="module">
        const results = document.getElementById('results');

        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }

        try {
            // Test 1: Module loading
            addResult('Testing module import...', 'info');
            addResult('✓ Module system works', 'success');

            // Test 2: Check if app.js exists
            addResult('Testing app.js accessibility...', 'info');
            fetch('/dist/app.js')
                .then(response => {
                    if (response.ok) {
                        addResult('✓ app.js is accessible', 'success');
                    } else {
                        addResult('✗ app.js not accessible', 'error');
                    }
                })
                .catch(() => addResult('✗ Failed to fetch app.js', 'error'));

            // Test 3: Check configuration endpoint
            addResult('Testing config endpoint...', 'info');
            fetch('/api/config')
                .then(response => response.json())
                .then(config => {
                    addResult(`✓ Config loaded: ${config.serverUrl}`, 'success');
                })
                .catch(() => addResult('✗ Config endpoint failed', 'error'));

            // Test 4: Check for Birko components
            addResult('Checking for Birko.Web components...', 'info');
            setTimeout(() => {
                if (customElements.get('kobold-lair-shell')) {
                    addResult('✓ kobold-lair-shell defined', 'success');
                } else {
                    addResult('✗ kobold-lair-shell not defined', 'error');
                }

                if (customElements.get('b-app-shell')) {
                    addResult('✓ b-app-shell defined', 'success');
                } else {
                    addResult('✗ b-app-shell not defined', 'error');
                }

                // Test 5: Check DOM elements
                const appShell = document.getElementById('app-shell');
                if (appShell) {
                    addResult('✓ app-shell element exists', 'success');
                } else {
                    addResult('✗ app-shell element missing', 'error');
                }

                addResult('Diagnostics complete!', 'success');
            }, 1000);

        } catch (error) {
            addResult(`Error: ${error.message}`, 'error');
            console.error('Test error:', error);
        }
    </script>
</body>
</html>
